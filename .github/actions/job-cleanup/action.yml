# Self-hosted Windows legs: leave nothing behind — run as the LAST step of the job.
#
# 1. Processes. A crashed CEF smoke (`CefShutdown()` 0xC0000005 after its assertions pass) leaves
#    CEF subprocesses alive; they hold open handles on the build tree's `locales\*.pak`, so the NEXT
#    job on the same runner fails copying them ("being used by another process"), and on a
#    persistent runner slot they would otherwise live on indefinitely. Scope is exactly this job's
#    own files: a process is stopped only if its executable lives under GITHUB_WORKSPACE or
#    RUNNER_TEMP — never a sibling runner's job, never a system process.
#
# 2. Machine temp. Under a LocalSystem service, std::filesystem::temp_directory_path() resolves
#    through GetTempPath2, which for SYSTEM returns C:\Windows\SystemTemp and IGNORES TEMP/TMP — so
#    the job-private TEMP set by windows-msvc cannot catch the tree's C++ tests, and several of them
#    never delete their `ctx-*` / `context-*` scratch entries. Those are swept here by AGE: only
#    entries older than 3 hours (well past the longest job timeout, 75 min) are removed, because a
#    younger one may belong to a CE job still running on a sibling runner of the same box. Other
#    tenants' files never match the repo-specific prefixes.
#
# Best-effort: it never fails the job. The caller guards it with
# `if: always() && runner.os == 'Windows' && runner.environment == 'self-hosted'`.

name: Clean up after this job (Windows self-hosted)
description: Stop this job's leftover processes and sweep stale ctx-/context- entries from the SYSTEM temp dir

runs:
  using: composite
  steps:
    - name: Stop leftover processes, sweep stale temp
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        $roots = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP) | Where-Object { $_ } |
          ForEach-Object { [System.IO.Path]::GetFullPath($_).TrimEnd('\') + '\' }
        $left = @(Get-CimInstance Win32_Process | Where-Object {
          $exe = $_.ExecutablePath
          $exe -and $_.ProcessId -ne $PID -and ($roots | Where-Object { $exe.StartsWith($_, [StringComparison]::OrdinalIgnoreCase) })
        })
        foreach ($p in $left) {
          Write-Host "::warning title=Leftover process::stopping $($p.Name) (pid $($p.ProcessId)) $($p.ExecutablePath)"
          Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
        }
        Write-Host "[job-cleanup] $($left.Count) leftover process(es) under $($roots -join ', ')"

        $cutoff = (Get-Date).AddHours(-3)
        $swept = 0
        foreach ($dir in @("$env:windir\SystemTemp", "$env:windir\Temp")) {
          Get-ChildItem -LiteralPath $dir -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^(ctx|context)-' -and $_.LastWriteTime -lt $cutoff } |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force -ErrorAction SilentlyContinue; if (-not (Test-Path -LiteralPath $_.FullName)) { $swept++ } }
        }
        Write-Host "[job-cleanup] swept $swept stale ctx-/context- temp entr(y/ies) older than 3h"
        exit 0
