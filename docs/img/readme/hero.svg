<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Context Game Engine — an AI-first, file-authoritative game engine on a microkernel where every feature is a package. Pre-alpha, source-available.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1a1238"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, Menlo, monospace; }
    .ring { transform-origin: 930px 170px; animation: spin 30s linear infinite; }
    .ring.r2 { animation-duration: 46s; animation-direction: reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pulse { transform-origin: 930px 170px; animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    .chip { animation: lit 6s ease-in-out infinite; }
    .c2 { animation-delay: 1s; } .c3 { animation-delay: 2s; } .c4 { animation-delay: 3s; } .c5 { animation-delay: 4s; } .c6 { animation-delay: 5s; }
    @keyframes lit { 0%,70%,100% { stroke-opacity: .25; } 15% { stroke-opacity: 1; } }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="930" cy="170" r="230" fill="url(#glow)"/>
    <circle cx="160" cy="300" r="220" fill="url(#glow2)"/>

    <!-- left: title block -->
    <g class="sans">
      <rect x="64" y="56" width="292" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="82" cy="70" r="4" fill="#fbbf24"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="94" y="75" font-size="13" fill="#cbd5e1" letter-spacing=".4">PRE-ALPHA · SOURCE-AVAILABLE</text>

      <text x="62" y="160" font-size="74" font-weight="800" fill="url(#title)" letter-spacing="-1">Context</text>
      <text x="64" y="198" font-size="26" font-weight="600" fill="#e2e8f0">Game Engine</text>
      <text x="64" y="238" font-size="19" fill="#94a3b8">AI-first · file-authoritative · headless-complete</text>
    </g>
    <g class="mono" font-size="14">
      <text x="64" y="284" fill="#67e8f9">❯</text>
      <text x="84" y="284" fill="#cbd5e1">every edit is a file write · GUI, CLI, AI = equal clients</text>
      <rect class="caret" x="566" y="272" width="8" height="15" fill="#e879f9"/>
    </g>

    <!-- right: microkernel with package orbit -->
    <circle class="ring" cx="930" cy="170" r="118" fill="none" stroke="#a5b4fc" stroke-opacity="0.35" stroke-dasharray="3 9"/>
    <circle class="ring r2" cx="930" cy="170" r="80" fill="none" stroke="#67e8f9" stroke-opacity="0.3" stroke-dasharray="2 7"/>

    <g class="pulse">
      <circle cx="930" cy="170" r="50" fill="#0b1020" stroke="url(#core)" stroke-width="2.5"/>
      <text x="930" y="167" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#e2e8f0">kernel</text>
      <text x="930" y="186" text-anchor="middle" class="mono" font-size="10" fill="#94a3b8">micro</text>
    </g>

    <g class="mono" font-size="12" fill="#cbd5e1" text-anchor="middle">
      <rect class="chip" x="887" y="36" width="86" height="26" rx="13" fill="#111a33" stroke="#67e8f9"/>
      <text x="930" y="53">physics</text>
      <rect class="chip c2" x="1012" y="92" width="86" height="26" rx="13" fill="#111a33" stroke="#a5b4fc"/>
      <text x="1055" y="109">audio</text>
      <rect class="chip c3" x="1012" y="222" width="86" height="26" rx="13" fill="#111a33" stroke="#e879f9"/>
      <text x="1055" y="239">input</text>
      <rect class="chip c4" x="887" y="278" width="86" height="26" rx="13" fill="#111a33" stroke="#67e8f9"/>
      <text x="930" y="295">ui</text>
      <rect class="chip c5" x="762" y="222" width="86" height="26" rx="13" fill="#111a33" stroke="#a5b4fc"/>
      <text x="805" y="239">animation</text>
      <rect class="chip c6" x="762" y="92" width="86" height="26" rx="13" fill="#111a33" stroke="#e879f9"/>
      <text x="805" y="109">particles</text>
    </g>
    <text x="1136" y="322" text-anchor="end" class="sans" font-size="12" fill="#64748b">every feature is a package</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
