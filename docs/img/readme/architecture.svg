<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-label="Architecture: project files are the source of truth. The headless EditorKernel daemon keeps a live index over them and serves one contract (CLI, RPC, MCP) to the editor app, the context CLI and AI agents. The RuntimeKernel runs deterministic fixed-tick sessions; the WebGPU renderer draws them natively and in the browser.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080F17"/><stop offset="1" stop-color="#030609"/></linearGradient>
    <radialGradient id="hzR" cx="0.18" cy="0" r="0.6"><stop offset="0" stop-color="#FF002A" stop-opacity="0.16"/><stop offset="1" stop-color="#FF002A" stop-opacity="0"/></radialGradient>
    <radialGradient id="hzB" cx="0.85" cy="0" r="0.6"><stop offset="0" stop-color="#3B9BFF" stop-opacity="0.14"/><stop offset="1" stop-color="#3B9BFF" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#A8C2D2" fill-opacity="0.08"/></pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF002A" stop-opacity="0"/><stop offset="0.3" stop-color="#FF2448" stop-opacity="0.6"/><stop offset="0.7" stop-color="#3B9BFF" stop-opacity="0.55"/><stop offset="1" stop-color="#3B9BFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1620"/><stop offset="1" stop-color="#070D14"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5A73"/><stop offset="1" stop-color="#6FA8D0"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="450" rx="18"/></clipPath>
  </defs>
  <style>
    .s { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; } .m { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace; white-space: pre; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
    .spin { animation: spin 40s linear infinite; transform-box: fill-box; transform-origin: center; }
    .spin.r { animation-duration: 60s; animation-direction: reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blink { animation: blink 1.1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="450" fill="url(#bg)"/><rect width="1200" height="450" fill="url(#hzR)"/><rect width="1200" height="450" fill="url(#hzB)"/>
    <rect width="1200" height="450" fill="url(#dots)"/>
    <text x="40" y="60" text-anchor="start" class="s" font-size="16" font-weight="700" letter-spacing="2.4" fill="#FF5A73">SOURCE OF TRUTH</text><text x="600" y="60" text-anchor="middle" class="s" font-size="16" font-weight="700" letter-spacing="2.4" fill="#FF5A73">HEADLESS DAEMON</text><text x="1160" y="60" text-anchor="end" class="s" font-size="16" font-weight="700" letter-spacing="2.4" fill="#FF5A73">EQUAL CLIENTS</text><rect x="40" y="84" width="290" height="168" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="40" y="96" width="3" height="144" rx="1.5" fill="#EAB308"/><text x="62" y="164.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">Project files</text><text x="62" y="190.0" class="s" font-size="16" fill="#8AA6B8">scenes, tilemaps: JSON</text><text x="62" y="212.0" class="s" font-size="16" fill="#8AA6B8">gameplay: TypeScript</text><rect x="440" y="84" width="320" height="168" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="440" y="96" width="3" height="144" rx="1.5" fill="#FF5A73"/><text x="462" y="164.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">EditorKernel</text><text x="462" y="190.0" class="s" font-size="16" fill="#8AA6B8">live index over the files</text><text x="462" y="212.0" class="s" font-size="16" fill="#8AA6B8">one contract: CLI · RPC · MCP</text><rect x="870" y="84" width="290" height="48" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="870" y="96" width="3" height="24" rx="1.5" fill="#6FA8D0"/><text x="892" y="114.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">Editor app</text><rect x="870" y="144" width="290" height="48" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="870" y="156" width="3" height="24" rx="1.5" fill="#6FA8D0"/><text x="892" y="174.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">context CLI</text><rect x="870" y="204" width="290" height="48" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="870" y="216" width="3" height="24" rx="1.5" fill="#6FA8D0"/><text x="892" y="234.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">AI agent</text><path id="w1" d="M330 148 H440" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="2.4s" begin="-0.0s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle><path id="w2" d="M440 188 H330" fill="none" stroke="#FF5A73" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#FF5A73"><animateMotion dur="2.4s" begin="-1.2s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle><path id="w3" d="M760 168 C 815 168 815 108 870 108" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="2.4s" begin="-0.0s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle><path id="w4" d="M760 168 H870" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="2.4s" begin="-0.8s" repeatCount="indefinite"><mpath href="#w4"/></animateMotion></circle><path id="w5" d="M760 168 C 815 168 815 228 870 228" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="2.4s" begin="-1.6s" repeatCount="indefinite"><mpath href="#w5"/></animateMotion></circle><path id="w6" d="M520 252 V300" fill="none" stroke="#22C55E" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#22C55E"><animateMotion dur="2.4s" begin="-0.0s" repeatCount="indefinite"><mpath href="#w6"/></animateMotion></circle><rect x="40" y="300" width="550" height="116" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="40" y="312" width="3" height="92" rx="1.5" fill="#22C55E"/><text x="62" y="354.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">RuntimeKernel</text><text x="62" y="380.0" class="s" font-size="16" fill="#8AA6B8">fixed-tick sessions · state hash · replays</text><text x="62" y="402.0" class="s" font-size="16" fill="#8AA6B8">TypeScript on V8 · C++/WASM native tier</text><rect x="610" y="300" width="550" height="116" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="610" y="312" width="3" height="92" rx="1.5" fill="#6FA8D0"/><text x="632" y="354.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">Renderer</text><text x="632" y="380.0" class="s" font-size="16" fill="#8AA6B8">WebGPU: native and in the browser</text><text x="632" y="402.0" class="s" font-size="16" fill="#8AA6B8">2D is first-class</text>
    <rect x="0" y="448" width="1200" height="2" fill="url(#rule)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="449" rx="18" fill="none" stroke="rgba(111,168,208,0.16)"/>
</svg>
