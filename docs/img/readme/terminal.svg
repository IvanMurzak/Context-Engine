<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Terminal: context new my-game scaffolds a runnable project; context describe --json prints the whole contract; context session new, session step --ticks 600 --json and session hash run a headless deterministic simulation and report its state hash in a JSON envelope.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141433"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>
  <style>
    .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, Menlo, monospace; font-size: 14px; }
    .sans { font-family: "Segoe UI", Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .cmd  { fill: #e2e8f0; }
    .ps   { fill: #67e8f9; }
    .cm   { fill: #64748b; }
    .out  { fill: #a5b4fc; }
    .ln   { animation: in .45s ease-out both; }
    .l1 { animation-delay: .2s; } .l2 { animation-delay: 1s; } .l3 { animation-delay: 1.8s; }
    .l4 { animation-delay: 2.6s; } .l5 { animation-delay: 3.3s; } .l6 { animation-delay: 4.1s; } .l7 { animation-delay: 4.8s; }
    @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="40" fill="#ffffff" fill-opacity="0.04"/>
    <circle cx="26" cy="20" r="6" fill="#f87171"/>
    <circle cx="46" cy="20" r="6" fill="#fbbf24"/>
    <circle cx="66" cy="20" r="6" fill="#34d399"/>
    <text x="600" y="25" text-anchor="middle" class="sans" font-size="13" fill="#94a3b8">context — headless, no GPU, no GUI</text>

    <g class="mono">
      <g class="ln l1"><text x="32" y="80"><tspan class="ps">$ </tspan><tspan class="cmd">context new my-game</tspan></text>
        <text x="610" y="80" class="cm"># a runnable project skeleton</text></g>
      <g class="ln l2"><text x="32" y="112"><tspan class="ps">$ </tspan><tspan class="cmd">context describe --json</tspan></text>
        <text x="610" y="112" class="cm"># the whole contract, machine-readable</text></g>
      <g class="ln l3"><text x="32" y="144"><tspan class="ps">$ </tspan><tspan class="cmd">context session new run.state --seed 7</tspan></text>
        <text x="610" y="144" class="cm"># a headless deterministic session</text></g>
      <g class="ln l4"><text x="32" y="176"><tspan class="ps">$ </tspan><tspan class="cmd">context session step run.state --ticks 600 --json</tspan></text>
        <text x="610" y="176" class="cm"># advance exactly 600 fixed ticks</text></g>
      <g class="ln l5"><text x="32" y="208" class="out">{"ok":true,"data":{"simTick":600,"stateHash":{"root":"…","archetypes":[…]}},…}</text></g>
      <g class="ln l6"><text x="32" y="240"><tspan class="ps">$ </tspan><tspan class="cmd">context session hash run.state --json</tspan></text>
        <text x="610" y="240" class="cm"># same seed + inputs → same hash</text></g>
      <g class="ln l7"><text x="32" y="272" class="ps">$</text>
        <rect class="caret" x="50" y="260" width="9" height="16" fill="#e879f9"/></g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
